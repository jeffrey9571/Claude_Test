name: Deploy to OCI VM

# master에 push되면 자동으로 OCI VM에 SSH 접속해 최신 소스를 배포한다.
# (수동 실행도 가능: Actions 탭 > Deploy to OCI VM > Run workflow)
#
# 사전 준비: 저장소 Settings > Secrets and variables > Actions 에 아래 3개 등록
#   VM_HOST    : VM 공인 IP (예: 140.238.x.x)
#   VM_USER    : SSH 사용자 (OCI Ubuntu 기본값: ubuntu)
#   VM_SSH_KEY : VM 접속용 SSH 개인키 전체 내용 (-----BEGIN ... END----- 포함)
#
# 전제: VM에 deploy/oci-setup.sh로 최초 설치가 끝나 있어야 한다.

on:
  push:
    branches: [master]
    # 문서·이미지만 바뀐 경우엔 재배포하지 않으려면 아래 주석을 참고해 경로 필터를 조정
    # paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: VM에 SSH 접속하여 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            sudo bash /opt/ifrs17/src/deploy/update.sh
